<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Менің алғашқы сайтым</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 20% 10%,#36205e,transparent 40%),#0d0d15;color:#f5f3ff;padding:24px}.card{max-width:650px;width:100%;border:1px solid #ffffff22;border-radius:26px;padding:42px;background:#ffffff0a;box-shadow:0 20px 80px #0005}small{color:#c4a7ff;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(32px,6vw,56px);line-height:1.1;margin:20px 0}p{line-height:1.7;color:#c9c5d7}button{border:0;border-radius:12px;padding:14px 22px;background:#a478f5;color:#120d20;font-weight:700;cursor:pointer}#status{margin-top:18px;min-height:24px;color:#c4a7ff}footer{margin-top:32px;font-size:13px;color:#88829b}
</style>
</head>
<body><main class="card"><small>GitHub Pages · Demo</small><h1>Сәлем, әлем! 👋</h1><p>Бұл — GitHub Pages платформасына орналастыруға дайын қарапайым веб-сайт. HTML, CSS және JavaScript арқылы жасалған.</p><button id="btn">Тексеру</button><p id="status" aria-live="polite"></p><footer>Оқу жобасы · 2026</footer></main><script>document.getElementById('btn').addEventListener('click',()=>{document.getElementById('status').textContent='Сайт дұрыс жұмыс істеп тұр! ✓'})</script></body></html>
